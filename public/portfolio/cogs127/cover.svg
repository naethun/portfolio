<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="COGS 127 — Robinhood practice-first learning concept">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbf6"/>
      <stop offset="1" stop-color="#e4f7ec"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00c805"/>
      <stop offset="1" stop-color="#37e07a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fdf9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="34" flood-color="#0a3d1f" flood-opacity="0.16"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="468" y="178" width="264" height="556" rx="36"/>
    </clipPath>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- ambient blobs (kept within frame) -->
  <circle cx="250" cy="300" r="190" fill="#00c805" opacity="0.05"/>
  <circle cx="970" cy="640" r="210" fill="#00c805" opacity="0.06"/>

  <!-- corner tag -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="92" y="96" width="292" height="40" rx="20" fill="#0d1f14"/>
    <text x="114" y="121" font-size="15" letter-spacing="1.5" fill="#37e07a">COGS 127 · UX CASE STUDY</text>
  </g>

  <!-- phone (centered) -->
  <g filter="url(#soft)">
    <rect x="450" y="160" width="300" height="592" rx="48" fill="#0d1f14"/>
    <rect x="462" y="172" width="276" height="568" rx="40" fill="url(#screen)"/>
  </g>

  <!-- screen content, clipped so nothing overflows -->
  <g clip-path="url(#screenClip)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- notch -->
    <rect x="540" y="194" width="120" height="16" rx="8" fill="#0d1f14" opacity="0.85"/>

    <text x="492" y="260" font-size="17" fill="#7a8a80">Practice Sandbox</text>
    <text x="492" y="304" font-size="34" font-weight="700" fill="#0d1f14">$10,000.00</text>
    <text x="492" y="332" font-size="15" fill="#00a705">mock funds · no real money</text>

    <!-- chart line, fully inside screen -->
    <path d="M488 520 C 528 504, 556 498, 590 468 S 654 408, 706 368"
          fill="none" stroke="url(#chart)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="706" cy="368" r="18" fill="#00c805" opacity="0.18"/>
    <circle cx="706" cy="368" r="9" fill="#00c805"/>

    <!-- lesson pills -->
    <rect x="492" y="600" width="216" height="42" rx="21" fill="#eafaf0"/>
    <rect x="504" y="611" width="20" height="20" rx="6" fill="#00c805"/>
    <text x="536" y="627" font-size="16" fill="#0d1f14">What is a P/E ratio?</text>

    <rect x="492" y="652" width="216" height="42" rx="21" fill="#f1f4f2"/>
    <rect x="504" y="663" width="20" height="20" rx="6" fill="#c4d2c9"/>
    <text x="536" y="679" font-size="16" fill="#5f6f66">Reading a stock chart</text>
  </g>
</svg>
