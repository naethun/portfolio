<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="COGS 127 — Robinhood learning case study cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3fbf4"/>
      <stop offset="0.55" stop-color="#eafaf0"/>
      <stop offset="1" stop-color="#dff6ea"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00c805"/>
      <stop offset="1" stop-color="#37e07a"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6fdf8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#0a3d1f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- ambient blobs -->
  <circle cx="1040" cy="150" r="220" fill="#00c805" opacity="0.06"/>
  <circle cx="150" cy="780" r="200" fill="#00c805" opacity="0.05"/>

  <!-- phone -->
  <g filter="url(#soft)">
    <rect x="470" y="170" width="380" height="700" rx="56" fill="#0d1f14"/>
    <rect x="486" y="186" width="348" height="668" rx="44" fill="url(#phone)"/>
    <rect x="566" y="206" width="188" height="22" rx="11" fill="#0d1f14" opacity="0.85"/>

    <!-- screen content: calm upward chart -->
    <text x="520" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#7a8a80">Practice Sandbox</text>
    <text x="520" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="600" fill="#0d1f14">$10,000.00</text>
    <text x="520" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#00a705">mock funds · no real money</text>

    <!-- gentle rising line -->
    <path d="M514 690 C 560 660, 600 650, 640 612 S 720 540, 760 470 S 800 410, 806 392"
          fill="none" stroke="url(#chart)" stroke-width="9" stroke-linecap="round"/>
    <path d="M514 690 C 560 660, 600 650, 640 612 S 720 540, 760 470 S 800 410, 806 392 L 806 720 L 514 720 Z"
          fill="#00c805" opacity="0.08"/>
    <circle cx="806" cy="392" r="11" fill="#00c805"/>
    <circle cx="806" cy="392" r="20" fill="#00c805" opacity="0.18"/>

    <!-- lesson pills -->
    <rect x="514" y="744" width="292" height="40" rx="20" fill="#eafaf0"/>
    <rect x="524" y="754" width="20" height="20" rx="6" fill="#00c805"/>
    <text x="556" y="769" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#0d1f14">What is a P/E ratio?</text>
    <rect x="514" y="794" width="292" height="40" rx="20" fill="#f1f4f2"/>
    <rect x="524" y="804" width="20" height="20" rx="6" fill="#c4d2c9"/>
    <text x="556" y="819" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#5f6f66">Reading a stock chart</text>
  </g>

  <!-- left text -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="96" y="300" width="150" height="34" rx="17" fill="#0d1f14"/>
    <text x="116" y="323" font-size="17" letter-spacing="1.5" fill="#37e07a">COGS 127</text>
    <text x="92" y="430" font-size="62" font-weight="600" fill="#0d1f14">Learn first,</text>
    <text x="92" y="500" font-size="62" font-weight="600" fill="#0d1f14">invest second.</text>
    <text x="96" y="560" font-size="25" fill="#3f5448">A zero-risk way for anxious beginners</text>
    <text x="96" y="594" font-size="25" fill="#3f5448">to build confidence inside Robinhood.</text>
  </g>
</svg>
